const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:bytes(P.salt), iterations:P.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(P.iv)}, key, bytes(P.ct));
  return new TextDecoder().decode(pt);
}
function render(html, pw) {

}
const f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
f.addEventListener('submit', async (e) => {
  e.preventDefault(); const pw = document.getElementById('pw').value.trim();
  go.disabled = true; msg.textContent = '';
  try { render(await unlock(pw), pw); }
  catch (err) { go.disabled = false; msg.textContent = (window.crypto && crypto.subtle) ? 'That password is not correct.' : 'This browser cannot open the page. Use a current browser over https.'; }
});
(async () => { let pw = null; try { pw = sessionStorage.getItem('dash-pw'); } catch (e) {} if (pw) { try { render(await unlock(pw), pw); } catch (e) {} } })();
